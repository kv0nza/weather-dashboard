version: '3.8'

services:
  skypulse-weather:
    build:
      context: .
      dockerfile: Dockerfile
    image: skypulse-weather:latest
    container_name: skypulse-weather-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
